name: Spring Boot build and deploy

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: spring-boot-app

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build Jar with Maven
        run: mvn clean package -DskipTests

      - name: Building Docker Image
        run: docker build -t ${{secrets.DOCKER_USERNAME}}/${{ env.IMAGE_NAME }}:latest .

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker Image
        run: docker push ${{secrets.DOCKER_USERNAME}}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to ES2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{secrets.DOCKER_USERNAME}}/${{ env.IMAGE_NAME }}:latest
            docker stop ${{ env.IMAGE_NAME }} || true
            docker rm ${{ env.IMAGE_NAME }} || true
            docker run -d --name ${{ env.IMAGE_NAME }} --restart unless-stopped -p 8081:8081 ${{secrets.DOCKER_USERNAME}}/${{ env.IMAGE_NAME }}:latest
            docker image prune -f